name: Preserve legacy swiryyX history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Copy original commits without rewriting history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git init --bare legacy.git
          cd legacy.git
          git fetch https://github.com/swiryy/swiryyX.git '+refs/heads/*:refs/heads/legacy/swiryyX/*' '+refs/tags/*:refs/tags/legacy/swiryyX/*'
          test "$(git rev-parse refs/heads/legacy/swiryyX/main)" = 7007d0ec0e06a51e905126be11daf0c29fc8a4d0
          test "$(git for-each-ref --format='%(refname)')" = refs/heads/legacy/swiryyX/main
          git fsck --full
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/swiryy/swiryyyyX-community.git refs/heads/legacy/swiryyX/main:refs/heads/legacy/swiryyX/main
          test "$(git ls-remote https://github.com/swiryy/swiryyyyX-community.git refs/heads/legacy/swiryyX/main | cut -f1)" = 7007d0ec0e06a51e905126be11daf0c29fc8a4d0
          echo 'Preserved original main and its complete commit history.'
